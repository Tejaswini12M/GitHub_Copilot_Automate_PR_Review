name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout PR code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js (Angular needs this)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Enforce TypeScript rules
      - name: Run ESLint (TypeScript)
        run: npx eslint "src/**/*.ts"

      # 5. Enforce SCSS rules
      - name: Run Stylelint (SCSS)
        run: npx stylelint "src/**/*.scss"
